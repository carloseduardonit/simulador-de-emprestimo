name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Faz o checkout do código-fonte
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura o Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # escolha uma versão estável, ex: 18 ou 20

      # 3️⃣ Instala dependências do projeto
      - name: Install dependencies
        run: npm install

      # 4️⃣ Instala o Cypress (opcional se já estiver no package.json)
      - name: Install Cypress
        run: npm install cypress --save-dev

      # 5️⃣ Executa os testes do Cypress (modo headless)
      - name: Run Cypress tests
        run: npx cypress run



